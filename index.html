<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohasu | Hub</title>
    <meta name="description" content="Rohasu — personal hub for GitHub, music brand, and mobile apps.">
    <meta property="og:title" content="Rohasu | Hub">
    <meta property="og:description" content="Links to GitHub, music brand, and AdMob verification.">
    <meta property="og:type" content="website">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0f19;
            --card: rgba(17, 24, 39, 0.72);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f3f4f6;
            --muted: #9ca3af;
            --accent: #818cf8; /* soft indigo */
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 24px;
        }

        /* Background blobs */
        .blob {
            position: absolute;
            width: min(420px, 80vw);
            height: min(420px, 80vw);
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.45), rgba(147, 51, 234, 0.35));
            filter: blur(90px);
            border-radius: 50%;
            animation: float 12s ease-in-out infinite alternate;
            z-index: -1;
            pointer-events: none;
        }

        .blob:nth-child(2) {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.35), rgba(79, 70, 229, 0.3));
            animation-duration: 16s;
            animation-direction: alternate-reverse;
            right: -80px;
            bottom: -80px;
        }

        @keyframes float {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.12); }
        }

        @media (prefers-reduced-motion: reduce) {
            .blob { animation: none; }
            .card { animation: none; }
            .btn  { transition: none; }
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 40px 32px;
            border-radius: 24px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.7s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.4rem;
            color: white;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
            background: linear-gradient(to right, #fff, #c4b5fd);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 28px;
            line-height: 1.45;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            border-radius: 14px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .btn.primary {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(168, 85, 247, 0.2));
            border-color: rgba(129, 140, 248, 0.35);
        }

        .btn.primary:hover {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.4), rgba(168, 85, 247, 0.3));
            border-color: rgba(129, 140, 248, 0.55);
        }

        .icon {
            width: 18px;
            height: 18px;
            opacity: 0.9;
            flex-shrink: 0;
        }

        footer {
            margin-top: 28px;
            font-size: 0.75rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="blob" aria-hidden="true"></div>
    <div class="blob" aria-hidden="true"></div>

    <main class="card">
        <div class="avatar" aria-hidden="true">R</div>
        <h1>Rohasu</h1>
        <p class="tagline">Personal hub for projects, music & mobile apps</p>

        <nav class="links" aria-label="Main links">

                <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

                </svg>
                GitHub

            <a href="https://remixx-brand.com" target="_blank" rel="noopener noreferrer" class="btn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

    </main>
</body>
</html>
